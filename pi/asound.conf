# Simpsons TV audio: the amplifier is wired to GPIO 19 only (PWM channel 1,
# the right channel). Downmix stereo to mono on both channels so nothing
# from the left channel is lost, and make the PWM "Headphones" card the default.
pcm.!default {
    type plug
    slave.pcm "mono_out"
}

pcm.mono_out {
    type route
    slave.pcm "hw:Headphones"
    slave.channels 2
    ttable.0.0 0.5
    ttable.1.0 0.5
    ttable.0.1 0.5
    ttable.1.1 0.5
}

ctl.!default {
    type hw
    card Headphones
}
